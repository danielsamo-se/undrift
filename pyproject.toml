[project]
name = "undrift"
version = "0.3.0"
description = "Undrift: policy-driven content drift detection with Cominty Managed Agents"
requires-python = ">=3.13"
dependencies = [
    "cominty-sdk>=1.2.0,<2",
    "mcp~=2.3.0",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "starlette>=0.46",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["api", "autonomy", "autonomy_schema", "guard", "clarification", "clarification_schema", "cli", "config", "discovery", "discovery_schema", "discovery_seed", "fixtures", "models", "publishing", "readmodel", "reliability", "run_impact", "server", "spike", "store", "workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
