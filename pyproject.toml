[project]
name = "undrift"
version = "0.1.0"
description = "Undrift preflight: Cominty Managed Agent with a custom MCP server"
requires-python = ">=3.13"
dependencies = [
    "cominty-sdk>=1.2.0,<2",
    "mcp~=2.3.0",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "fixtures", "server", "spike"]
